}
</style><text x="0" y="22" class="title" font-size="15">Where governance enters the pipeline</text><text x="0" y="42" class="muted" font-size="12">Tests, classification and descriptions attach to each dbt model; the artifacts below are generated from them.</text><rect x="8" y="66" width="150" height="40" rx="8" class="box" stroke-width="1.2"/><text x="83.0" y="90.0" text-anchor="middle" class="title" font-size="12">Raw feeds</text><rect x="196" y="66" width="150" height="40" rx="8" class="box" stroke-width="1.2"/><text x="271.0" y="90.0" text-anchor="middle" class="title" font-size="12">Staging</text><rect x="384" y="66" width="150" height="40" rx="8" class="box" stroke-width="1.2"/><text x="459.0" y="90.0" text-anchor="middle" class="title" font-size="12">Intermediate</text><rect x="572" y="66" width="150" height="40" rx="8" class="box" stroke-width="1.2"/><text x="647.0" y="90.0" text-anchor="middle" class="title" font-size="12">Mart</text><line x1="158.0" y1="86.0" x2="190.0" y2="86.0" class="arrow" stroke-width="1.4"/><path d="M 190.0,82.0 L 196.0,86.0 L 190.0,90.0" class="arrow" stroke-width="1.4"/><line x1="346.0" y1="86.0" x2="378.0" y2="86.0" class="arrow" stroke-width="1.4"/><path d="M 378.0,82.0 L 384.0,86.0 L 378.0,90.0" class="arrow" stroke-width="1.4"/><line x1="534.0" y1="86.0" x2="566.0" y2="86.0" class="arrow" stroke-width="1.4"/><path d="M 566.0,82.0 L 572.0,86.0 L 566.0,90.0" class="arrow" stroke-width="1.4"/><rect x="196" y="128" width="526" height="60" rx="10" class="obox" stroke-width="1.2"/><text x="210" y="145" class="muted" font-size="10.5" font-weight="600" letter-spacing="0.07em">GOVERNANCE, APPLIED AT EACH MODEL</text><rect x="210" y="156" width="158" height="22" rx="6" class="box" stroke-width="1"/><text x="289" y="171" text-anchor="middle" font-size="10.5">quality tests (DAMA)</text><rect x="380" y="156" width="158" height="22" rx="6" class="box" stroke-width="1"/><text x="459" y="171" text-anchor="middle" font-size="10.5">classification