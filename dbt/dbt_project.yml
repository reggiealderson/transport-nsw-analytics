name: 'transport_nsw_analytics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'transport_nsw_analytics'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  transport_nsw_analytics:
    # Staging + intermediate are lightweight views over the raw (read-only) data.
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    # The mart is materialised as a real table so it's a stable, self-contained artifact.
    marts:
      +materialized: table
      +schema: marts
